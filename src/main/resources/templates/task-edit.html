<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク編集 | Team Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <h1>タスク編集</h1>
            <p class="subtitle">タスクの内容を変更できます。</p>

            <form th:action="@{/tasks/{id}/edit(id=${taskId})}" th:object="${task}" method="post">

                <div class="message error" th:if="${#fields.hasErrors('title')}">
                    <p th:errors="*{title}"></p>
                </div>

                <div class="message error" th:if="${#fields.hasErrors('description')}">
                    <p th:errors="*{description}"></p>
                </div>

                <div class="message error" th:if="${#fields.hasErrors('status')}">
                    <p th:errors="*{status}"></p>
                </div>

                <div class="form-group">
                    <label for="title">タスク名</label>
                    <input type="text" id="title" th:field="*{title}" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="description">説明</label>
                    <textarea id="description" th:field="*{description}"></textarea>
                </div>

                <div class="form-group">
                    <label for="dueDate">期限</label>
                    <input type="date" id="dueDate" th:field="*{dueDate}">
                </div>

                <div class="form-group">
                    <label for="status">ステータス</label>
                    <select id="status" th:field="*{status}">
                        <option value="未着手">未着手</option>
                        <option value="進行中">進行中</option>
                        <option value="完了">完了</option>
                    </select>
                </div>

                <button type="submit" class="login-button">変更を保存</button>
            </form>

            <p class="subtitle">
                <a th:href="@{/tasks}">タスク一覧に戻る</a>
            </p>
        </section>
    </main>
</body>

</html>
