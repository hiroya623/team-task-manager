<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録 | Team Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <h1>ユーザー登録</h1>
            <p class="subtitle">アカウントを作成して利用を開始しましょう。</p>

            <div class="message error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label for="username">ユーザー名</label>
                    <input type="text" id="username" name="username" placeholder="ユーザー名を入力" maxlength="50" required>
                </div>

                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input type="email" id="email" name="email" placeholder="メールアドレスを入力" maxlength="100"
                        autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">パスワード（8文字以上）</label>
                    <input type="password" id="password" name="password" placeholder="パスワードを入力" minlength="8"
                        maxlength="72" autocomplete="new-password" required>
                </div>

                <button type="submit" class="login-button">
                    登録する
                </button>
            </form>

            <p class="subtitle">
                すでにアカウントをお持ちの方は
                <a th:href="@{/login}">ログイン</a>
            </p>
        </section>
    </main>
</body>

</html>
