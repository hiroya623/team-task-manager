<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Team Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <h1>Team Task Manager</h1>
            <p class="subtitle">チームのタスクを効率よく管理しましょう。</p>

            <div class="message success" th:if="${param.logout}">
                ログアウトしました。
            </div>

            <div class="message success" th:if="${param.registered}">
                ユーザー登録が完了しました。ログインしてください。
            </div>

            <div class="message error" th:if="${param.error}">
                メールアドレスまたはパスワードが正しくありません。
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">メールアドレス</label>
                    <input type="email" id="username" name="username" placeholder="メールアドレスを入力" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" placeholder="パスワードを入力"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-button">
                    ログイン
                </button>
            </form>
        </section>
    </main>
</body>

</html>
