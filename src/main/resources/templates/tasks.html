<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク一覧 | Team Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <h1>タスク管理</h1>
            <p class="subtitle">タスクの登録と一覧表示ができます。</p>

            <h2>タスクを登録</h2>

            <form th:action="@{/tasks}" th:object="${task}" method="post">

                <div class="message error" th:if="${#fields.hasErrors('title')}">
                    <p th:errors="*{title}"></p>
                </div>

                <div class="message error" th:if="${#fields.hasErrors('description')}">
                    <p th:errors="*{description}"></p>
                </div>

                <div class="form-group">
                    <label for="title">タスク名</label>
                    <input type="text" id="title" th:field="*{title}" maxlength="100" placeholder="タスク名を入力" required>
                </div>

                <div class="form-group">
                    <label for="description">説明</label>
                    <textarea id="description" th:field="*{description}" placeholder="タスクの説明を入力"></textarea>
                </div>

                <div class="form-group">
                    <label for="dueDate">期限</label>
                    <input type="date" id="dueDate" th:field="*{dueDate}">
                </div>

                <div class="form-group">
                    <label for="status">ステータス</label>
                    <select id="status" th:field="*{status}">
                        <option value="未着手">未着手</option>
                        <option value="進行中">進行中</option>
                        <option value="完了">完了</option>
                    </select>
                </div>

                <button type="submit" class="login-button">タスクを登録</button>
            </form>

            <h2>タスク一覧</h2>


            <form th:action="@{/tasks}" method="get">
                <div class="form-group">
                    <label for="keyword">タスク名で検索</label>
                    <input type="text" id="keyword" name="keyword" th:value="${keyword}" placeholder="キーワードを入力">
                </div>

                <div class="form-group">
                    <label for="status">ステータスで絞り込み</label>
                    <select id="status" name="status">
                        <option value="" th:selected="${status == ''}">すべて</option>
                        <option value="未着手" th:selected="${status == '未着手'}">未着手</option>
                        <option value="進行中" th:selected="${status == '進行中'}">進行中</option>
                        <option value="完了" th:selected="${status == '完了'}">完了</option>
                    </select>
                </div>

                <button type="submit" class="login-button">検索</button>
                <a th:href="@{/tasks}">検索を解除</a>
            </form>

            <div th:if="${#lists.isEmpty(tasks)}">
                <p>タスクはまだ登録されていません。</p>
            </div>

            <article class="task-item" th:each="item : ${tasks}">
                <hr>
                <h3 th:text="${item.title}">タスク名</h3>
                <p>
                    説明：
                    <span th:text="${item.description ?: '説明なし'}"></span>
                </p>
                <p>
                    ステータス：
                    <span class="task-status"
                        th:classappend="${item.status == '未着手'} ? ' status-not-started' : (${item.status == '進行中'} ? ' status-in-progress' : ' status-completed')"
                        th:text="${item.status}">
                    </span>
                </p>
                <p>
                    期限：
                    <span th:text="${item.dueDate ?: '未設定'}"></span>
                </p>
                <p>
                    作成者：
                    <span th:text="${item.createdBy.username}"></span>
                </p>
                <a th:href="@{/tasks/{id}/edit(id=${item.id})}">編集</a>

                <form th:action="@{/tasks/{id}/delete(id=${item.id})}" method="post"
                    onsubmit="return confirm('このタスクを削除しますか？');">
                    <button type="submit">削除</button>
                </form>
            </article>

            <p class="subtitle">
                <a th:href="@{/dashboard}">ダッシュボードに戻る</a>
            </p>
        </section>
    </main>
</body>

</html>
