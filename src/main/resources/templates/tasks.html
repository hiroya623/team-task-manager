<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理 | Team Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header class="dashboard-header">
        <a class="dashboard-logo" th:href="@{/dashboard}">
            Team Task Manager
        </a>

        <nav class="task-header-nav">
            <a th:href="@{/dashboard}">ダッシュボード</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-button">ログアウト</button>
            </form>
        </nav>
    </header>

    <main class="task-page">
        <div class="task-page-heading">
            <div>
                <p class="dashboard-label">TASK MANAGEMENT</p>
                <h1>タスク管理</h1>
                <p>タスクの登録・検索・進捗管理ができます。</p>
            </div>
        </div>

        <div class="task-layout">
            <section class="task-panel">
                <h2>タスクを登録</h2>
                <p class="panel-description">新しいタスクの情報を入力してください。</p>

                <form th:action="@{/tasks}" th:object="${task}" method="post">
                    <div class="message error" th:if="${#fields.hasErrors('title')}">
                        <p th:errors="*{title}"></p>
                    </div>

                    <div class="message error" th:if="${#fields.hasErrors('description')}">
                        <p th:errors="*{description}"></p>
                    </div>

                    <div class="form-group">
                        <label for="title">タスク名</label>
                        <input type="text" id="title" th:field="*{title}" maxlength="100" placeholder="例：設計書を作成する"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="description">説明</label>
                        <textarea id="description" th:field="*{description}" placeholder="タスクの詳細を入力してください"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">期限</label>
                        <input type="date" id="dueDate" th:field="*{dueDate}">
                    </div>

                    <div class="form-group">
                        <label for="createStatus">ステータス</label>
                        <select id="createStatus" th:field="*{status}">
                            <option value="未着手">未着手</option>
                            <option value="進行中">進行中</option>
                            <option value="完了">完了</option>
                        </select>
                    </div>

                    <button type="submit" class="login-button">＋ タスクを登録</button>
                </form>
            </section>

            <section class="task-panel">
                <h2>タスク一覧</h2>
                <p class="panel-description">キーワードやステータスでタスクを絞り込めます。</p>

                <form class="task-search-form" th:action="@{/tasks}" method="get">
                    <div class="form-group">
                        <label for="keyword">タスク名で検索</label>
                        <input type="text" id="keyword" name="keyword" th:value="${keyword}" placeholder="キーワードを入力">
                    </div>

                    <div class="form-group">
                        <label for="filterStatus">ステータス</label>
                        <select id="filterStatus" name="status">
                            <option value="" th:selected="${status == ''}">すべて</option>
                            <option value="未着手" th:selected="${status == '未着手'}">未着手</option>
                            <option value="進行中" th:selected="${status == '進行中'}">進行中</option>
                            <option value="完了" th:selected="${status == '完了'}">完了</option>
                        </select>
                    </div>

                    <button type="submit" class="login-button">検索する</button>
                    <a class="clear-search-link" th:href="@{/tasks}">検索を解除</a>
                </form>

                <div class="task-list-heading">
                    <h3>登録済みのタスク</h3>
                    <span class="task-count" th:text="${#lists.size(tasks)} + ' 件'">0 件</span>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(tasks)}">
                    <p>表示できるタスクがありません。</p>
                    <p>新しく登録するか、検索条件を変更してください。</p>
                </div>

                <article class="task-item task-card" th:each="item : ${tasks}">
                    <div class="task-card-top">
                        <span class="task-status"
                            th:classappend="${item.status == '未着手'} ? ' status-not-started' : (${item.status == '進行中'} ? ' status-in-progress' : ' status-completed')"
                            th:text="${item.status}">未着手</span>
                    </div>

                    <h3 th:text="${item.title}">タスク名</h3>

                    <p class="task-description" th:text="${item.description ?: '説明はありません。'}">
                        タスクの説明
                    </p>

                    <div class="task-meta">
                        <p>
                            <span class="meta-label">期限</span>
                            <span th:text="${item.dueDate ?: '未設定'}">未設定</span>
                        </p>
                        <p>
                            <span class="meta-label">作成者</span>
                            <span th:text="${item.createdBy.username}">作成者</span>
                        </p>
                    </div>

                    <div class="task-actions">
                        <a class="edit-task-link" th:href="@{/tasks/{id}/edit(id=${item.id})}">編集</a>

                        <form th:action="@{/tasks/{id}/delete(id=${item.id})}" method="post"
                            onsubmit="return confirm('このタスクを削除しますか？');">
                            <button type="submit" class="delete-task-button">削除</button>
                        </form>
                    </div>
                </article>
            </section>
        </div>
    </main>
</body>

</html>
